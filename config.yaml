input_dir: data/input
processed_dir: data/processed
output_dir: outputs
report_dir: reports
dpi: 300
device: auto
selected_engines:
  - paddle
  - surya
  - docling
  - easyocr
preprocessing_modes:
  - raw
  - clean
  - binarized
batch_size: 1
max_image_resolution: 2200
model_names:
  qwen: Qwen/Qwen2.5-VL-7B-Instruct
  trocr: microsoft/trocr-large-printed
enable_vlm: false
enable_stamp_signature_detection: true
run_timestamped_outputs: true
