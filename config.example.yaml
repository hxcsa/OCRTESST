input_dir: data/input
processed_dir: data/processed
output_dir: outputs
report_dir: reports

device: auto
dpi: 300

selected_engines: []
preprocessing_modes:
  - raw
  - clean
  - binarized

enable_stamp_signature_detection: true

model_names:
  qwen: Qwen/Qwen2.5-VL-7B-Instruct
  vlm: Qwen/Qwen2.5-VL-3B-Instruct
  text: Qwen/Qwen2.5-VL-7B-Instruct

qwen_gguf:
  repo_id: unsloth/Qwen3.5-9B-GGUF
  model_filename: Qwen3.5-9B-Q8_0.gguf
  mmproj_filename: mmproj-F16.gguf
  local_dir: models/Qwen3.5-9B-GGUF-Q8_0
  image_variant: raw
  max_images: 5
  n_ctx: 8192
  n_gpu_layers: -1
  llama_cli: tools/llama.cpp-cuda/llama-cli
  llama_server: tools/llama.cpp-cuda/llama-server
  server_host: 127.0.0.1
  server_port: 8088
  image_max_tokens: 1024
  max_tokens: 1400
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  min_p: 0.0
  seed: 0
  repeat_penalty: 1.18
  normalize_output_text: true
  use_transcription_anchor: true

qwen_full:
  local_dir: models/Qwen3.5-9B
  image_variant: raw
  max_images: 5
  max_new_tokens: 1000
  normalize_output_text: true
  use_transcription_anchor: false
